services:
  csp-auth-portal:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: csp-auth-portal
    ports:
      - "4201:80"
    environment:
      CORS_ALLOWED_ORIGIN_REGEX: ${CORS_ALLOWED_ORIGIN_REGEX:-^http://localhost:420[0-5]$$}
    networks:
      - csp-frontend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

networks:
  csp-frontend:
    external: true
    name: csp-frontend